; Runs the cwbcode backend under supervisor (make start / make stop). Its files (pid, socket,
; logs) are kept in ~/.cwbcode beside the backend's own.

[supervisord]
logfile=%(ENV_HOME)s/.cwbcode/supervisord.log
pidfile=%(ENV_HOME)s/.cwbcode/supervisord.pid
childlogdir=%(ENV_HOME)s/.cwbcode
nodaemon=false

[unix_http_server]
file=%(ENV_HOME)s/.cwbcode/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.cwbcode/supervisor.sock

[program:cwbcode]
; CWBCODE_SERVE_ARGS comes from the Makefile: the .env file to read, and --bind if one was asked for.
command=%(here)s/../bin/cwbcode serve %(ENV_CWBCODE_SERVE_ARGS)s
directory=%(ENV_HOME)s
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.cwbcode/server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
