[package]
name = "cwbcodeclient"
version = "0.1.0"
edition = "2024"
description = "Causeway Bay Code terminal client: talks to the cwbcode backend over HTTP/3, or HTTP/2 where QUIC is not available"
license = "MIT"

[lib]
name = "cwbcodeclient"
path = "src/lib.rs"

[[bin]]
name = "cwbcodeclient"
path = "src/main.rs"

[dependencies]
cwbcode-proto = { path = "../proto" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "http2", "stream"] }
bytes = "1"
http = "1"
futures = "0.3"
rustyline = "17"
libc = "0.2"
serde_json = "1"

[dev-dependencies]
