<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CC · Causewaybay Code</title>
  <!-- A progressive web app: a manifest, icons, a window of its own, and a service worker
       (assets/pwa/sw.js) that asks the backend first and keeps a copy for when it is away. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <!-- (?v= changes with the icon: a device that kept an earlier icon, or a failed one, asks again.) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
  <meta name="theme-color" content="#10173e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link data-trunk rel="copy-file" href="assets/pwa/sw.js">
  <link data-trunk rel="copy-file" href="assets/pwa/manifest.webmanifest">
  <link data-trunk rel="copy-file" href="assets/pwa/icon-512.png">
  <link data-trunk rel="copy-file" href="assets/pwa/icon-192.png">
  <link data-trunk rel="copy-file" href="assets/pwa/apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="assets/pwa/apple-touch-icon-precomposed.png">
  <link data-trunk rel="copy-file" href="assets/pwa/favicon-32.png">
  <link data-trunk rel="copy-file" href="assets/pwa/favicon.ico">
  <script>
    // What goes wrong on a device nobody can open a console on is told to the backend, which
    // writes it in its log (a request for a path that names it): at most twenty short lines.
    (function () {
      var left = 20;
      function tell(what) { if (left-- > 0) { try { new Image().src = '/__diag/' + encodeURIComponent(String(what).slice(0, 240)); } catch (_) {} } }
      window.__tell = tell;
      // The service worker. A browser registers one only where it trusts the certificate; where
      // it does not, the page works as before, without the copy for when the backend is away.
      if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      addEventListener('error', function (e) { tell('error: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown')); }, true);
      addEventListener('unhandledrejection', function (e) { tell('rejection: ' + (e.reason && (e.reason.message || e.reason))); });
      var shout = console.error; console.error = function () { tell('console: ' + Array.prototype.join.call(arguments, ' ')); return shout.apply(console, arguments); };
      addEventListener('TrunkApplicationStarted', function () { tell('started'); });
      setTimeout(function () {
        var app = document.querySelector('.app, .login');
        var box = app ? app.getBoundingClientRect() : null;
        tell('after 4s: ' + (app ? app.className + ' ' + Math.round(box.width) + 'x' + Math.round(box.height) : 'nothing drawn') + ', ' + document.body.innerText.length + ' letters, window ' + innerWidth + 'x' + innerHeight);
      }, 4000);
    })();
  </script>
  <link data-trunk rel="css" href="style.css">
  <link data-trunk rel="copy-file" href="assets/motion.min.js">
  <!-- three.js (MIT, vendored) and the Forge on it: loaded only while the model is on its way. -->
  <link data-trunk rel="copy-file" href="assets/three.module.min.js">
  <link data-trunk rel="copy-file" href="assets/forge.js">
  <!-- The typefaces and the pixel art, vendored too. -->
  <link data-trunk rel="copy-dir" href="assets/fonts">
  <link data-trunk rel="copy-dir" href="assets/art">
  <link data-trunk rel="rust" data-wasm-opt="z">
  <!-- Motion (motion.dev), vendored: the page works without the internet. -->
  <script src="/motion.min.js"></script>
</head>
<body></body>
</html>
