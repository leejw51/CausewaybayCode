[package]
name = "cwbcode-web"
version = "0.1.0"
edition = "2024"
description = "Causeway Bay Code in the browser: a dashboard and a client of the cwbcode backend (Leptos, WebAssembly)"
license = "MIT"

# Built on its own with trunk (make build), for wasm32: not part of the Cargo workspace.
[workspace]

[dependencies]
cwbcode-proto = { path = "../proto" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Location", "History", "Storage", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement",
    "Request", "RequestInit", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader",
    "File", "FileList", "Blob", "Url", "KeyboardEvent", "Event", "EventTarget", "ScrollToOptions", "ScrollBehavior",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
