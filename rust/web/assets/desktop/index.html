<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Causewaybay Code</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #0a0d24; color: #fcecc8; font: 15px/1.5 ui-monospace, Menlo, monospace; }
  .card { width: min(32rem, 90vw); padding: 1.6rem; border: 1px solid rgba(80, 216, 248, .16); border-radius: 12px; background: #10173e; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 24px; }
  h1 { margin: .8rem 0 .3rem; font-size: 1.1rem; font-weight: normal; color: #e9c94b; }
  #state { color: #9c97c2; white-space: pre-wrap; }
  #state.bad { color: #ff8a7a; text-align: left; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
  <!-- Shown while the app starts the backend (or finds one already running); then the window
       goes to the backend's own page. When something is wrong (or the backend stops), the app
       comes back here with a message in the address: #bad=... (an error) or #wait=... -->
  <div class="card">
    <img src="icon.png" alt="">
    <h1>Causewaybay Code</h1>
    <div id="state"><span class="dots">Starting the backend</span></div>
  </div>
  <script>
    function said() {
      const m = location.hash.match(/^#(bad|wait)=(.*)$/s);
      if (!m) return;
      const state = document.getElementById('state');
      let text = m[2];
      try { text = decodeURIComponent(text); } catch (e) {}
      state.className = m[1] === 'bad' ? 'bad' : '';
      state.textContent = '';
      const line = document.createElement('span');
      if (m[1] === 'wait') line.className = 'dots';
      line.textContent = text;
      state.appendChild(line);
    }
    said();
    addEventListener('hashchange', said);
  </script>
</body>
</html>
