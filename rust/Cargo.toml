# Causewaybay Code in Rust: a local coding and general-purpose agent on Inkling 2 Mini (MLX).
#   proto   the Cap'n Proto messages the three programs exchange
#   server  cwbcode: the backend (model, agent, tools, SQLite, HTTP/3 + HTTP/2)
#   client  cwbcodeclient: the terminal client
#   web     the web dashboard and client (Leptos, WebAssembly; built with trunk)
#   desktop the Mac app (Tauri): a window on the web client, the backend inside (make package)
[workspace]
members = ["proto", "server", "client"]
exclude = ["web", "desktop"]
resolver = "3"

[profile.release]
debug = false
