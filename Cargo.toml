# Causeway Bay Code: a local coding and general-purpose agent on Inkling 2 Mini (MLX).
#   rust/proto   the Cap'n Proto messages the three programs exchange
#   rust/server  cwbcode: the backend (model, agent, tools, SQLite, HTTP/3 + HTTP/2)
#   rust/client  cwbcodeclient: the terminal client
#   rust/web     the web dashboard and client (Leptos, WebAssembly; built with trunk)
[workspace]
members = ["rust/proto", "rust/server", "rust/client"]
exclude = ["rust/web"]
resolver = "3"

[profile.release]
debug = false
