# Verify: build everything and run the tests on every push to main and every pull request.
#
#   make build      the web client (trunk, WebAssembly), then cwbcode and cwbcodeclient; MLX is
#                   compiled from source (cmake, and Xcode's Metal compiler for its shaders)
#   make test       unit tests, and real backends driven by a scripted model (--script)
#   web_test.py     the web client in headless Chrome against such a backend
#
# The model (20 GB) is neither needed nor downloaded, so `make test-model`, `make e2e` and
# `make test-playwright` are not run here. Apple Silicon runner: the backend is macOS-only.
# Actions are pinned to commits, as in FruitNationMessenger's workflows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (macOS, Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust, with the WebAssembly target
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust -> target
            rust/web -> target
          # MLX's Metal library, which its build writes outside target/ (rust/Makefile build).
          cache-directories: ~/.mlx

      # capnp for the messages' schema, trunk for the web client, cmake for MLX.
      - name: Install build tools
        run: brew install capnp trunk cmake

      # MLX's shaders need Xcode's Metal compiler; newer Xcodes ship it as a separate component.
      - name: Xcode's Metal compiler
        run: |
          xcodebuild -version
          xcrun -sdk macosx metal --version || { xcodebuild -downloadComponent MetalToolchain && xcrun -sdk macosx metal --version; }

      - name: Build (web client, cwbcode, cwbcodeclient)
        run: make build

      - name: Test
        run: make test

      - name: Web client in headless Chrome
        run: |
          python3 -m pip install --quiet --break-system-packages websockets
          python3 rust/scripts/web_test.py "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-test-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
